keys:
  - &gregory_m4_pro_mac 
creation_rules:
  # Work: gregory-m4-pro-mac can decrypt everything under secrets/work/,
  # including host-specific subdirectories (e.g. linux-build24's own
  # secrets) -- the dev VM's key is only ever added to its own
  # subdirectory rule below, so its access is a strict subset of the
  # Mac's.
  - path_regex: secrets/work/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *gregory_m4_pro_mac
  - path_regex: secrets/work/linux-build24/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *gregory_m4_pro_mac
          # - *linux_build24 (add once its age key is generated)

  # Personal: no personal machine keys exist yet. Add a
  # secrets/personal/[^/]+\.(yaml|json|env|ini)$ rule (with its own
  # key_group, deliberately excluding every *_work_* key above) once the
  # first personal machine is added to the flake.
